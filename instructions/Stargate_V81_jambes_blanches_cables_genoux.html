<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>Stargate — salle d'activation</title>
<style>
:root{color-scheme:dark;--line:#40576b;--blue:#b9dff3;--amber:#ffb94c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;font-family:Arial,Helvetica,sans-serif;color:#e0edf7}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,#202936 0,#0b1018 60%,#030509 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#console{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:7px 10px max(8px,env(safe-area-inset-bottom));pointer-events:none;background:linear-gradient(180deg,transparent 0%,rgba(3,6,11,.55) 16%,rgba(3,6,11,.92) 48%,rgba(3,6,11,.98) 100%)}

.panel{pointer-events:auto;position:relative;max-width:520px;height:clamp(250px,39vh,330px);margin:auto;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0;overflow:visible;perspective:1100px;isolation:isolate}
.panel::before{content:"";position:absolute;left:1%;right:1%;top:3%;height:87%;border-radius:50%;z-index:0;background:radial-gradient(ellipse at 22% 18%,#d8c59b35 0,transparent 22%),radial-gradient(ellipse at 78% 24%,#b8c4cd24 0,transparent 28%),repeating-linear-gradient(118deg,#ffffff05 0 1px,#00000008 1px 3px,transparent 3px 7px),linear-gradient(155deg,#77756a 0%,#353938 12%,#222626 33%,#111719 58%,#343735 77%,#777265 94%,#252a2d 100%);border:2px solid #090d11;box-shadow:inset 0 3px 5px #e5e9ed66,inset 0 -12px 19px #000e,0 2px 0 #07090b,0 6px 0 #31383d,0 9px 0 #0b0e11,0 16px 22px #000d;transform:rotateX(24deg) scaleY(.91)}
.panel::after{display:none}
.topline{display:none;position:absolute;left:5px;right:5px;top:0;justify-content:space-between;align-items:center;gap:8px;color:#a9c3d8;font-size:10px;font-weight:800;letter-spacing:.1em;text-shadow:0 1px 3px #000}
#status{color:#ff8e88;text-align:right}.slots{display:none}
.keys{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotateX(19deg) scaleY(.94);transform-origin:center;width:min(83vw,370px);aspect-ratio:1.12/1;z-index:1;border-radius:50%;display:block;background:radial-gradient(ellipse at 26% 20%,#b6a57a26 0,transparent 23%),radial-gradient(ellipse at 74% 74%,#00000045 0,transparent 30%),repeating-linear-gradient(7deg,#ffffff04 0 1px,transparent 1px 4px),radial-gradient(ellipse at 43% 30%,#4c4d45 0%,#343631 31%,#242725 57%,#14191b 79%,#080c10 100%);border:5px solid #101418;box-shadow:0 0 0 2px #777d7c,0 0 0 5px #20262b,0 0 0 8px #8a8c83,0 0 0 11px #292e32,0 13px 0 #101519,0 19px 24px #000,inset 0 3px 5px #e4e0cc55,inset 0 -17px 24px #000c,inset 0 0 0 2px #0a0d0f}
.keys::before{content:"";position:absolute;inset:2%;border-radius:50%;pointer-events:none;border:2px solid #9c9272;box-shadow:inset 0 2px 5px #000b,0 1px 2px #d5c69a33}.keys::after{content:"";position:absolute;inset:5%;border-radius:50%;pointer-events:none;background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 45%,#00000008 45.3% 45.8%,transparent 46% 100%);opacity:.7}
.key{position:absolute;left:50%;top:50%;width:20%;height:20%;padding:0;border:0;border-radius:50%;background:radial-gradient(ellipse at 32% 25%,#514f43 0%,#282a27 57%,#111619 100%);color:#b6ad8e;font-size:clamp(15px,4vw,23px);font-family:Arial,sans-serif;font-weight:700;text-shadow:0 1px 2px #000,0 0 2px #c4b68a;transform:translate(-50%,-50%);display:grid;place-items:center;box-shadow:0 2px 0 #050708,0 3px 4px #0008,inset 0 1px 2px #b9b49a33,inset 0 -3px 4px #0009;filter:drop-shadow(0 1px 1px #000)}
.key::before{content:"";position:absolute;inset:2px;border-radius:50%;border:2px solid #5e5b4d;box-shadow:0 1px 0 #a9a18455,inset 0 2px 4px #000b;pointer-events:none;opacity:.9}.key:active{transform:translate(-50%,-50%) scale(.94)}
.key.picked{color:#fff3c7;text-shadow:0 0 8px #ffe28a,0 0 15px #ffbd45,0 1px 2px #000;filter:brightness(1.35) drop-shadow(0 0 5px #ffbf4c)}.key.picked::before{border-color:#ffdf8a;box-shadow:0 0 13px #ffcb5b,inset 0 0 9px #e8bd4d88;opacity:1}
/* V68 — bouton central en forme de champignon : calotte bombée et convexe,
   occupant 95 % du diamètre de sa base métallique. */
#engage{
  position:absolute;left:50%;top:44%;
  transform:translate(-50%,-50%);
  transform-origin:center;
  width:23%;aspect-ratio:1;border-radius:50%;border:0;
  isolation:isolate;
  background:radial-gradient(ellipse at 31% 17%,#e6e9e8 0%,#9ba3a6 9%,#535b60 24%,#252c30 50%,#111619 72%,#05080a 100%);
  color:transparent;
  box-shadow:0 2px 0 #050708,0 4px 0 #737a7d,0 7px 0 #202629,0 10px 13px #000e,
    inset 0 2px 3px #f5f6f488,inset 0 -5px 8px #000c;
  z-index:3;padding:0;font-size:0;
  filter:drop-shadow(0 0 8px #ff302b66);
}
/* Socle métallique — conserve le relief et la fixation de la pièce. */
#engage::before{
  content:"";position:absolute;inset:-17%;border-radius:50%;
  background:linear-gradient(145deg,#d7dcda 0%,#737c80 13%,#343b3f 29%,#171d20 47%,#070a0c 57%,#a9b0b1 72%,#555d60 86%,#171b1e 100%);
  box-shadow:0 2px 0 #050708,0 4px 0 #858b8d,0 7px 0 #171b1e,0 10px 14px #000c;
  z-index:-1;pointer-events:none;
}
/* Calotte rouge convexe : 1.273× le bouton hôte, soit 95 % du socle
   qui mesure 1.34×. Les ombres sont externes / de bord, sans effet d'enfoncement. */
#engage::after{
  content:"";position:absolute;inset:-13.65%;
  border-radius:50%;border:2px solid #ffb9a8;
  background:
    radial-gradient(ellipse at 28% 17%,#fff9ef 0%,#ffd7c8 3.5%,#ff9b83 8%,#ff5b45 17%,transparent 31%),
    radial-gradient(ellipse at 50% 34%,#ff5140 0%,#fa241f 35%,#df0718 61%,#a90012 82%,#62000b 100%);
  box-shadow:
    0 -2px 2px #fff1e5,
    0 3px 0 #8c0710,
    0 5px 5px #280207,
    0 0 12px #ff382fdd,
    0 0 26px #ff261f77;
  pointer-events:none;
}
#engage.repair-mode{cursor:pointer;filter:drop-shadow(0 0 12px #168cffaa)}
#engage.action.engage.repair-mode::after{border-color:#b8eaff;background:radial-gradient(ellipse at 34% 17%,#f4ffff 0%,#c8f2ff 7%,#65caff 20%,#168cff 43%,#0759c8 66%,#063b83 84%,#021b45 100%);box-shadow:inset 0 4px 5px #fff,inset 0 10px 12px #73d8ff,inset 0 -12px 15px #05285f,0 0 12px #168cff,0 0 24px #168cff88}
#engage:disabled{opacity:1;filter:none}
#engage:active{transform:translate(-50%,-48%) scale(.97);filter:brightness(.96) drop-shadow(0 0 7px #ff342e66)}
#engage:active::after{inset:10%;box-shadow:inset 0 3px 5px #fff8,inset 0 -8px 12px #580009,0 0 9px #ff382f99}
#clear{position:absolute;right:6px;bottom:0;width:36px;height:22px;padding:0;font-size:9px;opacity:.75;background:#111923;color:#bac8d2;border:1px solid #46525d;border-radius:5px}
#message{display:none;position:absolute;left:5px;right:45px;bottom:0;min-width:0;color:#a7b9c8;font-size:10px;line-height:1.3;text-shadow:0 1px 3px #000}
.action{height:39px;padding:0 11px;border:1px solid #526b7d;border-radius:9px;background:#142431;color:#dcebf5;font-weight:800;font-size:11px;white-space:nowrap}
.action.engage{border-color:#a77b3c;background:linear-gradient(#67481f,#24180d);color:#ffe2a6}
.action:disabled{opacity:.35}
@media(max-height:700px){.panel{height:clamp(180px,32vh,240px)}.keys{width:min(68vw,270px)}}
#hint{display:none;position:fixed;z-index:2;top:calc(env(safe-area-inset-top) + 7px);left:50%;transform:translateX(-50%);color:#b7c7d4;background:#07101bcc;border:1px solid #2a3b4b;border-radius:20px;padding:5px 10px;font-size:10px;letter-spacing:.08em;white-space:nowrap;pointer-events:none}
@media(max-height:700px){.panel{padding:7px 9px}.slots{margin:6px 0}.slot{height:30px}.key{height:35px}.bottom{margin-top:6px}.action{height:34px}}

/* V6 — console glyphs only: remove the individual round button rims.
   Keep the gate's 3D chevron symbols and materials untouched. */
.key{
  width:22%;
  height:22%;
  border:0!important;
  border-radius:0!important;
  background:transparent!important;
  box-shadow:none!important;
  filter:none!important;
  color:#c9c0a0;
  font-size:clamp(19px,5.1vw,29px);
  font-weight:800;
  text-shadow:
    0 -1px 0 #f1e8c8,
    0 1px 0 #77715b,
    0 2px 1px #171813,
    0 3px 2px #000,
    0 0 2px #d9cda6;
}
.key::before{display:none!important}
.key.picked{
  color:#fff0c4;
  text-shadow:
    0 -1px 0 #fff8df,
    0 1px 0 #8d7c4d,
    0 2px 2px #15130b,
    0 0 3px #e2c879,
    0 0 5px #d5ad4b88;
  filter:none!important;
}
.key.picked::before{display:none!important}


/* V7 — larger, subtly tilted cast-aluminium console glyphs.
   This targets .key buttons only; gate symbols/chevrons are left untouched. */
.key{
  font-size:clamp(24px,6.2vw,36px)!important;
  font-weight:800!important;
  color:#aeb8bf!important;
  transform:translate(-50%,-50%) rotate(-7deg)!important;
  -webkit-text-stroke:.35px #626d75;
  text-shadow:
    0 -1.5px 0 #f3f6f7,
    0 0 1px #e3e8eb,
    0 1px 0 #77828a,
    0 2px 0 #4b555d,
    0 3px 1px #20262b,
    0 4px 3px #000,
    1px 0 1px #dce2e5,
    -1px 0 1px #68737a!important;
  filter:drop-shadow(0 1px 1px #000)!important;
}
.key:active{
  transform:translate(-50%,-50%) rotate(-7deg) scale(.96)!important;
}
/* Slightly muted warm-neutral aluminum while selected; the symbol itself lights,
   without creating a luminous ring around its former button position. */
.key.picked{
  color:#fff0c9!important;
  -webkit-text-stroke:.4px #a88b50;
  text-shadow:
    0 -1px 0 #fff9e9,
    0 1px 0 #a68a54,
    0 2px 1px #2c2415,
    0 0 3px #dfc27b,
    0 0 5px #d5ad4b66!important;
  filter:drop-shadow(0 0 2px #d9b75d66)!important;
}


/* V8 — refined console surface inspired by the physical reference:
   restrained cast-metal grain, larger and more noticeably tilted glyphs.
   Gate geometry/materials are intentionally not targeted. */
.keys{
  background:
    radial-gradient(ellipse at 19% 13%,rgba(198,174,123,.10) 0,transparent 24%),
    radial-gradient(ellipse at 81% 82%,rgba(0,0,0,.19) 0,transparent 34%),
    repeating-linear-gradient(2deg,rgba(230,225,208,.018) 0 1px,rgba(0,0,0,.022) 1px 3px,transparent 3px 6px),
    radial-gradient(ellipse at 46% 29%,#4b4b43 0%,#353631 34%,#282a27 61%,#1c2020 83%,#111619 100%)!important;
}
.panel::before{
  background:
    radial-gradient(ellipse at 22% 17%,rgba(205,185,145,.12) 0,transparent 23%),
    radial-gradient(ellipse at 78% 76%,rgba(0,0,0,.17) 0,transparent 29%),
    repeating-linear-gradient(116deg,rgba(230,225,211,.018) 0 1px,rgba(0,0,0,.025) 1px 4px,transparent 4px 9px),
    linear-gradient(155deg,#68685f 0%,#3c3f3c 15%,#2c302e 38%,#202524 62%,#383a35 81%,#625f54 96%,#292e30 100%)!important;
}
.key{
  font-size:clamp(29px,7.5vw,44px)!important;
  transform:translate(-50%,-50%) rotate(-14deg)!important;
  -webkit-text-stroke:.45px #59636b!important;
  color:#b7c0c6!important;
  text-shadow:
    0 -1.7px 0 #f4f6f6,
    1px 0 0 #dce1e4,
    -1px 0 0 #737d84,
    0 1px 0 #8b969d,
    0 2px 0 #59636a,
    0 3px 0 #333b41,
    0 4px 1px #151a1e,
    0 5px 3px #000!important;
}
.key:active{
  transform:translate(-50%,-50%) rotate(-14deg) scale(.96)!important;
}
.key.picked{
  color:#fff0c9!important;
  text-shadow:
    0 -1.5px 0 #fff9e9,
    1px 0 0 #f4e5b6,
    -1px 0 0 #a48a50,
    0 1px 0 #b99b5b,
    0 2px 0 #796337,
    0 3px 1px #302716,
    0 0 4px #d7b65c99!important;
}


/* V9 — delicate aged cast-metal tabletop + larger glyph artwork.
   Console-only selectors; no gate symbol meshes/materials are restyled here. */
.keys{
  background:
    radial-gradient(ellipse at 17% 13%,rgba(205,180,128,.15) 0,transparent 25%),
    radial-gradient(ellipse at 84% 78%,rgba(0,0,0,.28) 0,transparent 36%),
    repeating-linear-gradient(7deg,rgba(235,227,207,.025) 0 1px,rgba(4,5,5,.045) 1px 2px,transparent 2px 5px),
    repeating-linear-gradient(97deg,rgba(180,174,153,.018) 0 1px,transparent 1px 7px),
    radial-gradient(ellipse at 48% 36%,#4a4a42 0%,#383a34 35%,#2c302d 64%,#1e2323 86%,#14191b 100%)!important;
  box-shadow:
    inset 0 1px 2px rgba(240,231,202,.28),
    inset 0 -16px 24px rgba(0,0,0,.48),
    0 2px 0 #090d10,
    0 7px 14px #0009!important;
}
.panel::before{
  background:
    radial-gradient(ellipse at 21% 16%,rgba(201,175,125,.17) 0,transparent 23%),
    radial-gradient(ellipse at 78% 74%,rgba(0,0,0,.26) 0,transparent 31%),
    repeating-linear-gradient(116deg,rgba(224,215,194,.026) 0 1px,rgba(8,9,8,.04) 1px 2px,transparent 2px 6px),
    repeating-linear-gradient(14deg,rgba(177,171,153,.018) 0 1px,transparent 1px 8px),
    linear-gradient(155deg,#66665d 0%,#484941 14%,#363833 34%,#292d2b 58%,#343732 78%,#57564d 94%,#292e30 100%)!important;
  box-shadow:
    inset 0 1px 2px rgba(238,229,205,.25),
    inset 0 -14px 20px rgba(0,0,0,.5),
    0 3px 7px rgba(0,0,0,.65)!important;
}
.key{
  font-size:clamp(34px,9vw,58px)!important;
  font-weight:700!important;
  transform:translate(-50%,-50%) rotate(-19deg)!important;
  -webkit-text-stroke:.25px #626d75!important;
  text-shadow:
    0 -1.5px 0 #f0f3f4,
    1px 0 0 #dce1e4,
    -1px 0 0 #727c83,
    0 1px 0 #909ba2,
    0 2px 0 #5b656c,
    0 3px 0 #343c42,
    0 4px 1px #151a1e,
    0 5px 3px #000!important;
}
.key:active{transform:translate(-50%,-50%) rotate(-19deg) scale(.97)!important}
.key.picked{
  text-shadow:
    0 -1.5px 0 #fff9e9,
    1px 0 0 #f4e5b6,
    -1px 0 0 #a48a50,
    0 1px 0 #b99b5b,
    0 2px 0 #796337,
    0 3px 1px #302716,
    0 0 3px #d7b65d88!important;
}
/* Every clamp insert gets its own emissive face. This avoids changing the
   shared red-clamp material and makes the success blue reliably visible. */


/* V64 — relooking console : plateau 3D incliné dans le même plan que son support.
   Ces règles restent limitées à la console ; porte, vortex, robot et passerelle intacts. */
.panel::before{
  transform:rotateX(24deg) scaleY(.91);
  background:
    radial-gradient(ellipse at 18% 13%,rgba(218,199,151,.13) 0,transparent 24%),
    radial-gradient(ellipse at 82% 83%,rgba(0,0,0,.3) 0,transparent 35%),
    repeating-linear-gradient(117deg,rgba(224,218,199,.025) 0 1px,rgba(0,0,0,.045) 1px 2px,transparent 2px 7px),
    linear-gradient(155deg,#77766c 0%,#4b4c45 13%,#343732 35%,#252a29 60%,#333631 79%,#666358 94%,#272c2f 100%)!important;
  border:2px solid #090d11;
  box-shadow:inset 0 2px 3px rgba(235,232,218,.36),
    inset 0 -17px 22px rgba(0,0,0,.58),
    0 2px 0 #07090b,0 6px 0 #30363a,0 9px 0 #0b0e11,0 16px 22px #000d!important;
}
.keys{
  transform:translate(-50%,-50%) rotateX(24deg) scaleY(.94)!important;
  transform-origin:center;
  background:
    radial-gradient(ellipse at 22% 17%,rgba(201,181,137,.12) 0,transparent 24%),
    radial-gradient(ellipse at 78% 78%,rgba(0,0,0,.3) 0,transparent 32%),
    repeating-linear-gradient(8deg,rgba(235,228,207,.025) 0 1px,rgba(5,6,5,.045) 1px 2px,transparent 2px 6px),
    repeating-linear-gradient(98deg,rgba(183,177,156,.016) 0 1px,transparent 1px 8px),
    radial-gradient(ellipse at 48% 36%,#4b4c43 0%,#383a34 36%,#292d2a 66%,#1b2021 87%,#111619 100%)!important;
  border:5px solid #111619;
  box-shadow:0 0 0 2px #777d7c,0 0 0 5px #252b30,0 0 0 8px #898b82,
    0 0 0 11px #292f33,0 13px 0 #101519,0 19px 24px #000,
    inset 0 3px 6px rgba(239,235,218,.3),inset 0 -18px 26px #000c,
    inset 0 0 0 2px #0a0d0f!important;
}
.keys::before{
  inset:2%;border:2px solid #a49a7c;
  box-shadow:inset 0 2px 6px #000c,0 1px 2px rgba(221,205,164,.25),
    0 0 0 1px rgba(0,0,0,.55)!important;
}
.keys::after{inset:5%;opacity:.45}
.key{transform:translate(-50%,-50%) rotate(-19deg)!important}
.key:active{transform:translate(-50%,-50%) rotate(-19deg) scale(.97)!important}


/* V65 — correction d'angle : le plateau et tous ses éléments (glyphes + bouton)
   partagent désormais une inclinaison plus prononcée, cohérente avec le support. */
.panel::before{
  transform:rotateX(39deg) scaleY(1.02)!important;
  transform-origin:center bottom!important;
}
.keys{
  transform:translate(-50%,-50%) rotateX(39deg) scaleY(1.02)!important;
  transform-origin:center bottom!important;
}
/* Les caractères restent posés sur le même plan incliné que le plateau.
   On conserve leur rotation propre dans le plan, sans les redresser face caméra. */
.key{
  transform:translate(-50%,-50%) rotate(-19deg)!important;
  transform-origin:center center!important;
}
.key:active{
  transform:translate(-50%,-50%) rotate(-19deg) scale(.97)!important;
}



/* V67 — perspective plus marquée : le plateau doit présenter un ovale aussi aplati visuellement que le bouton central, sans déplacer la console.
   On incline le conteneur entier : plateau, symboles, bouton central et reliefs
   restent dans un même plan 3D. Les anciens rotateX internes sont neutralisés
   afin d'éviter une double inclinaison ou des éléments qui resteraient à plat. */
.panel{
  transform:perspective(900px) rotateX(43deg)!important;
  transform-origin:center bottom!important;
}
.panel::before{
  transform:none!important;
  transform-origin:center center!important;
}
.panel .keys{
  transform:translate(-50%,-50%)!important;
  transform-origin:center center!important;
}
.panel #engage{
  transform:translate(-50%,-50%)!important;
  transform-origin:center center!important;
}
.panel .key{
  transform:translate(-50%,-50%) rotate(-7deg)!important;
  transform-origin:center center!important;
}
.panel .key:active{
  transform:translate(-50%,-50%) rotate(-7deg) scale(.96)!important;
}
/* V68 final override: raised mushroom cap, wide and convex, covering 95% of its metal base. */
.panel #engage::after{
  inset:-13.65%!important;
  border-radius:50%!important;
  background:
    radial-gradient(ellipse at 28% 17%,#fff9ef 0%,#ffd7c8 3.5%,#ff9b83 8%,#ff5b45 17%,transparent 31%),
    radial-gradient(ellipse at 50% 34%,#ff5140 0%,#fa241f 35%,#df0718 61%,#a90012 82%,#62000b 100%)!important;
  box-shadow:0 -2px 2px #fff1e5,0 3px 0 #8c0710,0 5px 5px #280207,
    0 0 12px #ff382fdd,0 0 26px #ff261f77!important;
}
.panel #engage:active::after{inset:-11.5%!important}

/* Yellow reset control: requires three consecutive taps, then the red control. */
.action.reset{color:#171006!important;background:linear-gradient(180deg,#fff08a 0%,#ffd12e 42%,#c88a08 100%)!important;border:1px solid #fff0a0!important;box-shadow:inset 0 1px 2px #fff8c9,0 2px 0 #654407,0 4px 8px #000b!important;text-shadow:0 1px 0 #fff5b0!important;font-weight:900!important;letter-spacing:.08em}
.action.reset.armed{box-shadow:0 0 0 2px #fff4a8,0 0 14px #ffcf24, inset 0 1px 2px #fff8c9!important}
/* Central red mushroom: normally dark; lit only for a full chevron lock or RESET countdown. */
.panel #engage::after{
  background:radial-gradient(ellipse at 50% 18%,#3d1719 0%,#26090b 48%,#100507 78%,#050304 100%)!important;
  box-shadow:inset 0 5px 12px #000e,0 2px 0 #08090b,0 4px 7px #000b!important;
  filter:saturate(.35) brightness(.42)!important;
}
.panel #engage.red-lit::after{
  background:
    radial-gradient(ellipse at 30% 14%,#fff9e9 0%,#ffd8c8 3%,#ff9a7f 8%,#ff5140 18%,transparent 34%),
    radial-gradient(ellipse at 50% 36%,#ff5140 0%,#fa241f 35%,#df0718 61%,#a90012 82%,#62000b 100%)!important;
  box-shadow:0 -2px 2px #fff1e5,0 3px 0 #8c0710,0 5px 5px #280207,
    0 0 12px #ff382fdd,0 0 26px #ff261f77!important;
  filter:none!important;
}

/* During the 5-second RESET confirmation window, the mushroom is amber/yellow. */

  for (const raw of candidates) {
    const normalized = String(raw).toLowerCase().replace(/[^a-z0-9]/g, '');

function rotateRingTo(targetAngle,direction,duration=TURN_DURATION){
 return new Promise(resolve=>{
   const start=performance.now();
   const initial=innerRing.rotation.z;
   // Direction is explicit: -1 = anti-clockwise, +1 = clockwise.
   // Travel at least one full revolution, then stop on the exact target angle.
   let delta;
   if(direction<0){
     delta=-(((initial-targetAngle)%TWO_PI+TWO_PI)%TWO_PI);
     if(Math.abs(delta)<1e-8)delta=0;
     delta-=TWO_PI;
   }else{
     delta=(((targetAngle-initial)%TWO_PI+TWO_PI)%TWO_PI);
     if(Math.abs(delta)<1e-8)delta=0;
     delta+=TWO_PI;
   }
   const travelDuration=Math.max(duration,Math.abs(delta)/TWO_PI*duration);
   const exactTarget=initial+delta;
   function frame(now){
     const progress=Math.min((now-start)/travelDuration,1);
     const eased=progress*progress*(3-2*progress);
     innerRing.rotation.z=progress===1?exactTarget:initial+delta*eased;
     if(progress<1)requestAnimationFrame(frame); else resolve();
   }
   requestAnimationFrame(frame);
 });
}

function drawLedText(ctx, canvas, text, centerY){
  const pitch=8.6;
  const dotRadius=2.75;
  const charStep=pitch*6; // five LED columns plus one blank column
  const maxChars=19;      // date/time is always 19 characters
  const textWidth=text.length*charStep-pitch;
  const startX=(canvas.width-textWidth)/2;
  const startY=centerY-(7*pitch)/2;

  ctx.save();
  ctx.shadowColor=LED_DISPLAY_STYLE.glow;
  ctx.shadowBlur=LED_DISPLAY_STYLE.glowBlur;
  ctx.fillStyle=LED_DISPLAY_STYLE.color;

  for(let i=0;i<text.length;i++){
    const glyph=LED_GLYPHS[text[i]] || LED_GLYPHS[' '];
    for(let row=0;row<7;row++){
      for(let col=0;col<5;col++){
        if(glyph[row][col]!=='1') continue;
        const x=startX+i*charStep+col*pitch;
        const y=startY+row*pitch;
        ctx.beginPath();
        ctx.arc(x,y,dotRadius,0,Math.PI*2);
        ctx.fill();
      }
    }
  }
  ctx.restore();
}

function updateArrivingRobot(now){
  if(!robotWalkActive||!arrivingRobot)return;
  const elapsed=(now-robotWalkStart)/1000;
  const progress=Math.min(elapsed/robotWalkDuration,1);
  const eased=progress*progress*(3-2*progress);
  // Walk forward from the Stargate threshold, staying centered on the bridge.
  arrivingRobot.position.z=-3.15+8.0*eased;
  // Keep the robot's soles at the actual bridge-deck height throughout arrival.
  // The feet extend about 0.39 world units below the robot root after scaling.
  // The deck is elevated at the gate (world z=1.15, y=4.06) and slopes
  // gently downward toward the viewer. Do not start the robot high in the
  // event horizon or interpolate from a floating portalRootY.
  const bridgeZ=arrivingRobot.position.z;
  const deckY=4.06-Math.max(0,bridgeZ-1.15)*Math.sin(.12);
  const soleOffset=.39;
  arrivingRobot.position.y=deckY+soleOffset;
  const stride=Math.sin(elapsed*7.6)*(1-progress*.35);
  robotParts.legs[0].rotation.x=stride*.62;
  robotParts.legs[1].rotation.x=-stride*.62;
  robotParts.arms[0].rotation.x=-stride*.40;
  robotParts.arms[1].rotation.x=stride*.40;
  robotParts.torso.position.y=Math.abs(Math.sin(elapsed*15.2))*.035*(1-progress*.4);
  arrivingRobot.rotation.y=Math.sin(elapsed*1.2)*.025;
  if(progress>=1){
    robotWalkActive=false;
    robotParts.legs.forEach(leg=>leg.rotation.x=0);
    robotParts.arms.forEach(arm=>arm.rotation.x=0);
    robotParts.torso.position.y=0;
    // A mismatched official team code triggers the destruction scene: no hologram.
    if(!robotSelfDestructOnArrival) showTeamHologram();
    if(robotSelfDestructOnArrival && !robotSelfDestructTriggered){
      robotSelfDestructTriggered=true;
      void triggerRobotSelfDestruct();
    }
  }
}
async function triggerRobotSelfDestruct(){
  if(!arrivingRobot) return;
  // Three-second progressive red warning, then the full destruction sequence.
  const recolor=[];
  arrivingRobot.traverse(obj=>{
    if(obj.isMesh && obj.material && obj.material.color) recolor.push(obj);
  });
  const redStart=performance.now();
  await new Promise(resolve=>{
    function redden(now){
      const t=Math.min((now-redStart)/3000,1);
      recolor.forEach(obj=>{
        obj.material.color.lerpColors(new THREE.Color(0xf0f2f4),new THREE.Color(0xff0808),t);
        if(obj.material.emissive){
          obj.material.emissive.set(0xff0000);
          obj.material.emissiveIntensity=1.8*t;
        }
      });
      if(t<1) requestAnimationFrame(redden); else resolve();
    }
    requestAnimationFrame(redden);
  });
  await stageStargateDestruction();
}

function activateVortex(){
   // Activate the event-horizon: a blue, turbulent vortex expands from the
   // outer rim toward the centre over exactly one second, then remains visible.
   const vortexUniforms={
     uTime:{value:0},
     uReveal:{value:0}
   };
   const vortexMaterial=new THREE.ShaderMaterial({
     uniforms:vortexUniforms,
     transparent:true,
     depthWrite:false,
     side:THREE.DoubleSide,
     vertexShader:`
       varying vec2 vUv;
       void main(){
         vUv=uv;
         gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
       }
     `,
     fragmentShader:`
       precision highp float;
       varying vec2 vUv;
       uniform float uTime;
       uniform float uReveal;
       void main(){
         vec2 p=(vUv-0.5)*2.0;
         float r=length(p);
         float a=atan(p.y,p.x);
         float t=uTime;
         float swirl=a+2.7*r-0.42*t+sin(r*18.0-t*1.8)*0.12;
         float n=sin(swirl*7.0+sin(r*23.0-t*2.0)*1.8)

function setSupportIndicatorColor(color, intensity){
  // Only the inset indicators on the four attachment brackets change color.
  // Use the requested hue directly (blue at engagement, vivid red after a
  // rejected address) and disable tone mapping to preserve its saturation.
  supportIndicatorMaterials.forEach(material=>{

    material.color.set(active?color:0x681b16);
    material.emissive.set(active?color:0x000000);
    material.emissiveIntensity=active?intensity:0;

function setSupportIndicatorBlue(on){

function animateSupportClampsInward(distance=0.42,duration=720){
  // The attachment chevrons are mounted on the four clamp groups. Once the
  // rotating ring stops, move each complete clamp radially toward the aperture.
  return new Promise(resolve=>{
    const starts=supportClampGroups.map(group=>group.position.clone());
    const start=performance.now();
    function step(now){
      const p=Math.min((now-start)/duration,1);
      const eased=p*p*(3-2*p);
      supportClampGroups.forEach((group,index)=>{
        const origin=starts[index];
        const radial=new THREE.Vector3(origin.x,origin.y,0).normalize();
        group.position.x=origin.x-radial.x*distance*eased;
        group.position.y=origin.y-radial.y*distance*eased;
      });
      if(p<1)requestAnimationFrame(step);
      else resolve();
    }
    requestAnimationFrame(step);
  });
}
function setChevronStateColor(color, intensity){
  chevrons.forEach(c=>{
    c.glowMaterial.color.set(color);
    c.glowMaterial.emissive.set(color);
    c.glowMaterial.emissiveIntensity=intensity;
    c.lit.material.color.set(color);
    c.lit.material.emissive.set(color);
    c.lit.material.emissiveIntensity=intensity;
  });
}
function animateRingHalfTurn(from,to,duration){
  return new Promise(resolve=>{
    const start=performance.now();
    function step(now){
      const p=Math.min((now-start)/duration,1);
      // Smooth mechanical acceleration/deceleration, preserving the exact target.
      const eased=p*p*(3-2*p);
      innerRing.rotation.z=from+(to-from)*eased;
      if(p<1)requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}

// Cinematic destruction: explosive flash, thick room-filling smoke, scattered
// gate fragments, collapsed event horizon, with only the robot's lower legs left.
async function stageStargateDestruction(){
  if(!arrivingRobot) return;
  const center=arrivingRobot.position.clone();
  // Record the original gate hierarchy and world transforms before any mesh is detached.
  gate.updateWorldMatrix(true,true);
  destructionSceneSnapshot=[];
  gate.traverse(obj=>{
    obj.updateWorldMatrix(true,false);
    destructionSceneSnapshot.push({
      object:obj, parent:obj.parent, position:obj.position.clone(),
      quaternion:obj.quaternion.clone(), scale:obj.scale.clone(), visible:obj.visible,
      worldPosition:obj.getWorldPosition(new THREE.Vector3()),
      worldQuaternion:obj.getWorldQuaternion(new THREE.Quaternion()),
      worldScale:obj.getWorldScale(new THREE.Vector3())
    });
  });

  // Keep the complete robot visible through the actual blast onset. Only after
  // the explosion flash has peaked do we leave the two lower legs on the bridge.
  arrivingRobot.userData.hologramShown=false;

  // Brief white-hot flash and fiery blast.
  const flash=new THREE.PointLight(0xff4a12,0,30);
  flash.position.copy(center); scene.add(flash);
  const flashStart=performance.now();
  await new Promise(resolve=>{
    function flashFrame(now){
      const t=Math.min((now-flashStart)/850,1);
      flash.intensity=85*Math.sin(Math.PI*t)*(1-t*.18);
      if(t<1) requestAnimationFrame(flashFrame); else resolve();
    }
    requestAnimationFrame(flashFrame);
  });
  flash.intensity=0;
  // The torso/head/arms disappear at the blast, not before it.
  // Keep the leg shells pearl-white, with localized soot and a few exposed wires.
  arrivingRobot.children.forEach(child=>{
    child.visible = robotParts.legs.includes(child);
  });

  if(!arrivingRobot.userData.explosionLegDamageAdded){
    arrivingRobot.userData.explosionLegDamageAdded=true;

    // Explicitly restore the robot's leg armor to white after the blast.
    // Some scene states/tints can leave the original orange appearance applied.
    const postBlastWhite=new THREE.MeshStandardMaterial({
      color:0xf4f5f6, metalness:.12, roughness:.32
    });
    robotParts.legs.forEach(leg=>{
      leg.traverse(part=>{
        if(!part.isMesh || part.userData.isExplosionDamageDetail) return;
        if(part.geometry && (
          part.geometry.type==='CapsuleGeometry' ||
          part.geometry.type==='SphereGeometry' ||
          part.geometry.type==='CylinderGeometry'
        )){
          part.material=postBlastWhite;
        }
      });
    });

    const sootMat=new THREE.MeshBasicMaterial({
      color:0x17191c, transparent:true, opacity:.78,
      depthWrite:false, side:THREE.DoubleSide
    });
    const sootSoftMat=new THREE.MeshBasicMaterial({
      color:0x34383c, transparent:true, opacity:.48,
      depthWrite:false, side:THREE.DoubleSide
    });
    const wireMat=new THREE.MeshStandardMaterial({
      color:0x17191b, metalness:.55, roughness:.38
    });
    const copperMat=new THREE.MeshStandardMaterial({
      color:0xb56b32, metalness:.62, roughness:.35
    });

    robotParts.legs.forEach((leg,index)=>{
      // Uneven, flat soot patches on the front/outer face of the white shin.
      const sootGroup=new THREE.Group();
      sootGroup.position.set(index===0 ? -.025 : .025,-.75,.105);
      sootGroup.rotation.z=index===0 ? -.16 : .13;
      leg.add(sootGroup);

      const stain1=new THREE.Mesh(new THREE.SphereGeometry(.105,16,12),sootMat);
      stain1.userData.isExplosionDamageDetail=true;
      stain1.scale.set(.72,1.65,.13);
      stain1.position.set(index===0 ? -.035 : .025,.015,.012);
      sootGroup.add(stain1);

      const stain2=new THREE.Mesh(new THREE.SphereGeometry(.075,14,10),sootSoftMat);
      stain2.userData.isExplosionDamageDetail=true;
      stain2.scale.set(1.5,.72,.12);
      stain2.position.set(index===0 ? .06 : -.045,-.14,.018);
      sootGroup.add(stain2);

      // Short irregular soot streaks running upward from the damaged shin.
      for(let k=0;k<3;k++){
        const streak=new THREE.Mesh(
          new THREE.CapsuleGeometry(.012+Math.random()*.009,.075+Math.random()*.08,3,7),
          k===1 ? sootMat : sootSoftMat
        );
        streak.userData.isExplosionDamageDetail=true;
        streak.position.set((Math.random()-.5)*.13,.08+k*.045,.035);
        streak.rotation.z=(Math.random()-.5)*.48;
        sootGroup.add(streak);
      }

      // Two torn electrical leads emerge from the outer side of each lower leg.
      const outer=index===0 ? -1 : 1;
      const wirePoints=[
        new THREE.Vector3(outer*.075,-.47,.06),
        new THREE.Vector3(outer*.17,-.51,.12),
        new THREE.Vector3(outer*.22,-.59,.16),
        new THREE.Vector3(outer*.16,-.65,.10)
      ];
      const wireCurve=new THREE.CatmullRomCurve3(wirePoints);
      const wire=new THREE.Mesh(new THREE.TubeGeometry(wireCurve,16,.012,7,false),wireMat);
      leg.add(wire);

      const secondWireCurve=new THREE.CatmullRomCurve3([
        new THREE.Vector3(outer*.06,-.52,.07),
        new THREE.Vector3(outer*.13,-.57,.15),
        new THREE.Vector3(outer*.11,-.63,.19)
      ]);
      const secondWire=new THREE.Mesh(
        new THREE.TubeGeometry(secondWireCurve,12,.008,6,false),copperMat
      );
      leg.add(secondWire);
    });
  }

  // Close/remove the event horizon: its material and mesh are explicitly hidden.
  if(vortexMaterialRef){
    vortexMaterialRef.uniforms.uOpacity && (vortexMaterialRef.uniforms.uOpacity.value=0);
    vortexMaterialRef.dispose();
    vortexMaterialRef=null;
  }
  gate.traverse(obj=>{
    if(obj.isMesh && (obj.geometry && obj.geometry.type==='CircleGeometry')){
      obj.visible=false;
    }
  });

  // Break the gate, its chevrons AND their mounting/clamp assemblies loose.
  // Object3D.attach preserves each mesh's world transform while removing it
  // from its former parent, so no chevron remains visibly suspended in mid-air.
  const debris=[];
  const destructibleRoots=[innerRing,chevronGroup,gate,...supportClampGroups];
  const meshSet=new Set();
  destructibleRoots.forEach(root=>root.traverse(obj=>{
    if(obj.isMesh && obj.visible && obj.geometry && obj!==aperture && obj.geometry.type!=='CircleGeometry') meshSet.add(obj);
  }));
  meshSet.forEach(obj=>{
    obj.updateWorldMatrix(true,false);
    scene.attach(obj);
    obj.userData.debrisVelocity=new THREE.Vector3(
      (Math.random()-.5)*7,
      Math.random()*5+1,
      (Math.random()-.5)*5
    );
    obj.userData.debrisSpin=new THREE.Vector3(
      (Math.random()-.5)*8,(Math.random()-.5)*8,(Math.random()-.5)*8
    );
    obj.userData.debrisSettled=false;
    debris.push(obj);
  });

  // Several layers of volumetric-looking smoke billow through the room.
  const smokeMat=new THREE.MeshBasicMaterial({
    color:0x292d33,transparent:true,opacity:.78,depthWrite:false
  });
  const smoke=[];
  explosionSmokeObjects=smoke;
  for(let i=0;i<44;i++){
    const radius=.55+Math.random()*1.0;
    const puff=new THREE.Mesh(new THREE.SphereGeometry(radius,14,12),smokeMat.clone());
    puff.position.set(center.x+(Math.random()-.5)*5,
      center.y+(Math.random()-.5)*3.2,
      center.z+(Math.random()-.5)*2.5);
    puff.scale.set(1.15,.8,1);
    puff.userData.smokeVelocity=new THREE.Vector3((Math.random()-.5)*.7,
      .35+Math.random()*1.2,(Math.random()-.5)*.45);
    puff.userData.smokeLife=4.5+Math.random()*4;
    puff.userData.smokeStart=performance.now();
    scene.add(puff); smoke.push(puff);
  }

  // Continue the physical fall until debris has settled and smoke has expired.
  // A hard deadline is intentional: on mobile, a fragment can miss the floor
  // threshold due to geometry/perspective. That must never block the blue button.
  const animationStart=performance.now();
  const smokeDurationMax=8500;       // longest generated smoke lifetime
  const settleGraceMs=1600;           // let the last fragments come to rest
  const hardDeadlineMs=15000;         // fail-safe for mobile rendering/physics
  await new Promise(resolve=>{
    let previous=animationStart;
    let settledFrames=0;
    function destructionFrame(now){
      const dt=Math.min((now-previous)/1000,.05);
      previous=now;
      let allSettled=true;

      debris.forEach(piece=>{
        if(piece.userData.debrisSettled) return;
        const velocity=piece.userData.debrisVelocity;
        velocity.y-=9.8*dt;
        piece.position.addScaledVector(velocity,dt);
        piece.rotation.x+=piece.userData.debrisSpin.x*dt;
        piece.rotation.y+=piece.userData.debrisSpin.y*dt;
        piece.rotation.z+=piece.userData.debrisSpin.z*dt;

        const floorY=-.02;
        if(piece.position.y<=floorY){
          piece.position.y=floorY;
          if(Math.abs(velocity.y)>.75){
            velocity.y=Math.abs(velocity.y)*.22;
            velocity.x*=.68;
            velocity.z*=.68;
          }else{
            velocity.set(0,0,0);
            piece.userData.debrisSettled=true;
          }
        }
        if(!piece.userData.debrisSettled) allSettled=false;
      });

      smoke.forEach(puff=>{
        puff.position.addScaledVector(puff.userData.smokeVelocity,dt);
        puff.scale.multiplyScalar(1+dt*.12);
        const age=(now-puff.userData.smokeStart)/1000;
        puff.material.opacity=Math.max(0,.78*(1-age/puff.userData.smokeLife));
      });

      const elapsed=now-animationStart;
      if(allSettled) settledFrames++; else settledFrames=0;

      const smokeExpired=elapsed>=smokeDurationMax;
      const fragmentsRested=settledFrames>=18;
      const timedOut=elapsed>=hardDeadlineMs;

      if(!timedOut && (!smokeExpired || (!fragmentsRested && elapsed<smokeDurationMax+settleGraceMs))){
        requestAnimationFrame(destructionFrame);
        return;
      }

      // Guarantee a clean, stable post-explosion state before repair is enabled.
      if(timedOut){
        debris.forEach(piece=>{
          piece.userData.debrisVelocity?.set(0,0,0);
          piece.userData.debrisSpin?.set(0,0,0);
          piece.userData.debrisSettled=true;
          if(piece.position.y<-.02) piece.position.y=-.02;
        });
      }
      smoke.forEach(puff=>{
        puff.material.opacity=0;
        scene.remove(puff);
        puff.geometry?.dispose();
        puff.material?.dispose();
      });
      explosionSmokeObjects=[];
      resolve();
    }
    requestAnimationFrame(destructionFrame);
  });
  flash.removeFromParent();
}

async function repairDestroyedScene(){
  // Blue button readiness is independent from the explosion animation. Never let
  // a click interrupt falling debris/smoke; repair starts only after both finish.
  if(!repairReady || !destructionVisualComplete || engageSequenceRunning) return;
  engageSequenceRunning=true;
  
  engageBtn.classList.remove('repair-mode');
  messageEl.textContent='RÉPARATION EN COURS…';
  statusEl.textContent='RESTAURATION';
  statusEl.style.color='#75c8ff';

  // Remove the smoke from the room and dispose its temporary meshes/materials.
  explosionSmokeObjects.forEach(puff=>{
    scene.remove(puff);
    puff.geometry?.dispose();
    puff.material?.dispose();
  });
  explosionSmokeObjects=[];

  // Animate detached debris back to the exact world-space position/orientation
  // captured before the blast, then put every piece back into its original parent.
  const detached=destructionSceneSnapshot.filter(item=>item.object.parent===scene && item.object!==gate);
  const startData=detached.map(item=>({
    item, position:item.object.getWorldPosition(new THREE.Vector3()),
    quaternion:item.object.getWorldQuaternion(new THREE.Quaternion()),
    scale:item.object.getWorldScale(new THREE.Vector3())
  }));
  const start=performance.now(), duration=1900;
  await new Promise(resolve=>{
    function frame(now){
      const t=Math.min((now-start)/duration,1);
      const eased=t*t*(3-2*t);
      startData.forEach(({item,position,quaternion,scale})=>{
        const obj=item.object;
        obj.position.lerpVectors(position,item.worldPosition,eased);
        obj.quaternion.copy(quaternion).slerp(item.worldQuaternion,eased);
        obj.scale.lerpVectors(scale,item.worldScale,eased);
      });
      if(t<1) requestAnimationFrame(frame); else resolve();
    }
    requestAnimationFrame(frame);
  });

  // Restore original parentage and local transforms, plus visibility of the portal.
  destructionSceneSnapshot.forEach(item=>{
    const obj=item.object;
    if(item.parent && obj.parent!==item.parent) item.parent.add(obj);
    obj.position.copy(item.position);
    obj.quaternion.copy(item.quaternion);
    obj.scale.copy(item.scale);
    obj.visible=item.visible;
  });
  if(vortexMaterialRef && vortexMaterialRef.uniforms.uReveal) vortexMaterialRef.uniforms.uReveal.value=1;
  if(arrivingRobot){
    arrivingRobot.removeFromParent();
    arrivingRobot=null;
  }
  robotSelfDestructOnArrival=false;
  robotSelfDestructTriggered=false;
  robotWalkActive=false;
  isOpen=false;
  destructionComplete=false;
  destructionVisualComplete=false;
  repairReady=false;
  engageBtn.classList.remove('repair-mode');
  
  entered.length=0;
  selectedChevronIndices.length=0;
  pendingChevronIndex=-1;
  pendingSymbol='';
  innerRing.rotation.z=0;
  setChevronStateColor('#ffe1a0',3.6);
  setSupportIndicatorBlue(false);
  engageBtn.setAttribute('aria-label','Activer');
  engageBtn.title='Activer';
  statusEl.textContent='SYSTÈME RÉTABLI';
  statusEl.style.color='#9df0be';
  messageEl.textContent='La pièce est réparée. La console est prête.';
  keyButtons.forEach(b=>b.disabled=false);
  clearBtn.disabled=false;
  renderConsole();
  setControlsDisabled(false);
  engageSequenceRunning=false;
  clearResetSequence();
}

async function runEngageSequence(){
  if(destructionComplete){ await repairDestroyedScene(); return; }
  if(engageSequenceRunning||isOpen||isDialing||entered.length!==5)return;
  engageSequenceRunning=true;
  isDialing=true;
  setControlsDisabled(true);
  keyButtons.forEach(b=>b.disabled=true);
  clearBtn.disabled=true;
  

  const addressIsCorrect=isTeamCodeValid(entered);
  const enteredTeam=identifyTeamFromCode(entered);
  // A recognized team's code used under another team's URL is a valid address,
  // but activates the robot's delayed self-destruct after it reaches the bridge.
  robotSelfDestructOnArrival=(
    CONNECTED_TEAM !== null &&
    enteredTeam !== null &&
    enteredTeam !== CONNECTED_TEAM
  );
  robotSelfDestructTriggered=false;
  const initialRotation=innerRing.rotation.z;

  statusEl.textContent='ENGAGEMENT…';
  statusEl.style.color='#75c8ff';
  messageEl.textContent='Voyants bleus. Rotation de la roue…';
  setSupportIndicatorBlue(true);

  // Same mechanical sweep for success and rejection:
  // 180° counter-clockwise in 2 s, then 180° clockwise in 2 s.
  await animateRingHalfTurn(initialRotation,initialRotation+Math.PI,2000);
  await animateRingHalfTurn(initialRotation+Math.PI,initialRotation,2000);

  if(addressIsCorrect){
    // Keep the display tied to the team selected in the URL.
    // The entered code identifies the destination/address, not the selected team;
    // especially, another team's code must not overwrite the wall display.
    showTeamWallDisplay(CONNECTED_TEAM);
    // The wheel has now completed both turns. Only now engage the gate's
    // mounted chevrons/attachment indicators for a valid address.
    await waitMs(350);
    // After the rotating wheel has come to a complete stop, the four mounted
    // chevron clamps physically travel inward toward the inner wheel and light.
    setChevronStateColor('#66baff',4.2);
    setSupportIndicatorColor(0x168cff,3.8);
    await animateSupportClampsInward(0.42,720);
    statusEl.textContent='ADRESSE VALIDÉE';
    statusEl.style.color='#9df0be';
    messageEl.textContent='Les cinq chevrons sont activés. Ouverture de la porte…';
    await waitMs(650);
    isOpen=true;
    activateVortex();
    // activateVortex opens the horizon over 1 second; its water jet must wait
    // until the opening is fully revealed, handled by the delayed jet start.
    keyButtons.forEach(b=>b.disabled=true);
    clearBtn.disabled=false;
  }else{
    statusEl.textContent='ADRESSE REFUSÉE';
    statusEl.style.color='#ff8e88';
    messageEl.textContent='Code incorrect. Les voyants des accroches passent en rouge vif…';
    // Once the ring has completed both turns, the attachment-mounted
    // chevrons/indicators switch to a saturated luminous red (not pink).
    setSupportIndicatorColor(0xff0018,2.8);
    if(arrivingRobot){
      const redMaterial=new THREE.MeshStandardMaterial({color:0xff1010,emissive:0xff0000,emissiveIntensity:0});
      const recolor=[];
      arrivingRobot.traverse(obj=>{if(obj.isMesh && obj.material && obj.material.color) recolor.push(obj);});
      const redStart=performance.now();
      // Repair availability uses its own 10-second timer from the explosion onset.
      // It does not control, cancel, or await the visual destruction animation.
      destructionComplete=false;
      destructionVisualComplete=false;
      repairReady=false;
      const explosionStartedAt=performance.now();
      const repairTimer=setTimeout(()=>{
        repairReady=true;
        destructionComplete=true; // enables repair-mode click routing, not explosion stop
        engageBtn.classList.add('repair-mode');
        engageBtn.setAttribute('aria-label','Réparer la pièce');
        engageBtn.title='Réparer';
        
        messageEl.textContent=destructionVisualComplete
          ? 'EXPLOSION TERMINÉE — Appuie sur le bouton bleu pour réparer.'
          : 'RÉPARATION DISPONIBLE — L’explosion continue jusqu’à son terme.';
        statusEl.textContent='SYSTÈME À RÉINITIALISER';
        statusEl.style.color='#75c8ff';
      },10000);

      await new Promise(resolve=>{
        function redden(now){
          const t=Math.min((now-redStart)/3000,1);
          recolor.forEach(obj=>{
            obj.material.color.lerpColors(new THREE.Color(0xf0f2f4),new THREE.Color(0xff0808),t);
            if(obj.material.emissive){obj.material.emissive.set(0xff0000);obj.material.emissiveIntensity=1.8*t;}
          });
          if(t<1) requestAnimationFrame(redden); else resolve();
        }
        requestAnimationFrame(redden);
      });
      await stageStargateDestruction();
      destructionVisualComplete=true;
      // In case visual destruction finishes after the independent timer, the
      // timer alone has already made the button blue; do not change its state here.
      if(repairReady){
        messageEl.textContent='EXPLOSION TERMINÉE — Appuie sur le bouton bleu pour réparer.';
      }
    } else {
      await waitMs(3000);
    }

    // Preserve the completed destruction scene and blue repair control.
    if(!destructionComplete){
    // All chevrons go dark, then the whole dialing state returns to home.
    chevrons.forEach(c=>{
      c.lit.visible=false;
      c.targetRadius=c.baseRadius;
      c.glowMaterial.emissiveIntensity=0;
    });
    await waitMs(1000);
    entered.length=0;
    selectedChevronIndices.length=0;
    pendingChevronIndex=-1;
    pendingSymbol='';
    innerRing.rotation.z=0;
    setChevronStateColor('#ffe1a0',3.6);
    setSupportIndicatorBlue(false);
    statusEl.textContent='CHEVRONS ÉTEINTS';
    statusEl.style.color='#ff8e88';
    messageEl.textContent='La console est prête pour une nouvelle séquence.';
    renderConsole();
    keyButtons.forEach(b=>b.disabled=false);
    clearBtn.disabled=false;
    }
  }

  isDialing=false;
  engageSequenceRunning=false;
  if(!isOpen && !destructionComplete){
    setControlsDisabled(false);
  }
}

function deactivateVortexForReset(){
  // Close the portal horizon to its initial hidden state when no debris snapshot exists.
  if(vortexMaterialRef?.uniforms?.uReveal) vortexMaterialRef.uniforms.uReveal.value=0;
  if(arrivingRobot){ arrivingRobot.removeFromParent(); arrivingRobot=null; }
  robotWalkActive=false; robotSelfDestructOnArrival=false; robotSelfDestructTriggered=false;
  destructionComplete=false; destructionVisualComplete=false; repairReady=false;
}
engageBtn.addEventListener('click',(event)=>{
  // Handle the central control in capture phase so decorative/overlay handlers
  // cannot swallow the confirmation click.
  event.stopImmediatePropagation();
  event.preventDefault();

  // Absolute dispatch priority: yellow means RESET. Capture this state BEFORE
  // clearing timers/classes, otherwise the reset-yellow class disappears first.
  const resetRequested=resetHasPriority();
  if(resetRequested){
    window.location.reload();
    return;
  }

  clearResetSequence();
  runEngageSequence();
},true);
renderConsole();

function resize(){
 renderer.setSize(innerWidth,innerHeight);
 camera.aspect=innerWidth/innerHeight;
 // On narrow/portrait displays, keep the complete ring inside the upper canvas area.
 const portrait=innerHeight>innerWidth;
 camera.position.z=portrait?22.8:18.8;
 camera.position.y=portrait?5.15:5.0;
 camera.lookAt(0,portrait?3.65:3.35,0);
 camera.updateProjectionMatrix();
}
resize();
addEventListener('resize',resize);
const chevronClock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(chevronClock.getDelta(),.05);
 // Smoothly slide each activated chevron inward; return it to its resting
 // radius when the address is cleared or the symbol is no longer selected.
 for(const c of chevrons){
   const ease=1-Math.exp(-dt*7.5);
   c.currentRadius+=(c.targetRadius-c.currentRadius)*ease;
   c.group.position.x=Math.cos(c.angle)*c.currentRadius;
   c.group.position.y=Math.sin(c.angle)*c.currentRadius;
 }
 if(vortexMaterialRef) vortexMaterialRef.uniforms.uTime.value+=dt;
 updateArrivingRobot(performance.now());
 if(arrivingRobot && arrivingRobot.userData.hologramShown){
   const ht=performance.now()/1000;
   const beam=arrivingRobot.userData.hologramBeam;
   const panel=arrivingRobot.userData.hologramPanel;
   if(beam){ beam.material.opacity=.23+.09*(.5+.5*Math.sin(ht*2.1)); beam.scale.x=beam.scale.z=1+.06*Math.sin(ht*1.7); }
   if(panel){ panel.material.opacity=.91+.05*(.5+.5*Math.sin(ht*2.8)); panel.position.y=3.72+.025*Math.sin(ht*1.4); }
 }
 if(waterJet){
   const elapsed=(performance.now()-waterJetStart)/1000;
   if(elapsed<0){
     waterJet.visible=false;
   }else if(elapsed>=2.5){waterJet.visible=false;waterJet=null;}
   else {
     waterJet.visible=true;
     const p=elapsed/2.5;
     const pulse=Math.sin(Math.PI*p);
     const swell=Math.sin(Math.PI*Math.min(p*1.18,1));
     waterJet.scale.set(0.30+1.36*pulse,0.30+1.36*pulse,0.28+2.10*pulse);
     waterJet.children.forEach((layer,i)=>{
       if(layer.material.uniforms){
         layer.material.uniforms.uTime.value=elapsed*5.0+i*1.15;
         layer.material.uniforms.uOpacity.value=[1.0,.96,.88,.78,.66,.58][i]*(0.82+0.18*Math.max(0,swell))*Math.max(0,pulse);
       } else {
         layer.material.opacity=[0.92,.72,.48][i-6]*Math.max(0,pulse);
       }
     });
   }
 }
 renderer.render(scene,camera);
}
animate();
</script>
</body>
